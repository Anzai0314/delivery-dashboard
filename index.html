<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="配達記録">
<title>配達記録</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.10.0/dist/tabler-icons.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
:root{
  --bg:#ffffff;--bg2:#f5f5f4;--bg3:#eeede9;
  --text:#1a1a18;--text2:#6b6b67;--text3:#9a9a96;
  --border:rgba(0,0,0,0.12);--border2:rgba(0,0,0,0.22);
  --radius:8px;--radius-lg:12px;
  --uber:#06C167;--demae:#FF6B00;--rocket:#E91E63;
  --up:#06C167;--down:#E91E63;
}
@media(prefers-color-scheme:dark){
  :root{--bg:#1c1c1a;--bg2:#262624;--bg3:#2e2e2c;--text:#f0efeb;--text2:#9a9a96;--text3:#6b6b67;--border:rgba(255,255,255,0.12);--border2:rgba(255,255,255,0.22);}
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,'Hiragino Sans','Noto Sans JP',sans-serif;font-size:14px}
body{display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;border-bottom:0.5px solid var(--border);background:var(--bg);position:sticky;top:0;z-index:10}
.topbar-title{font-size:16px;font-weight:600;display:flex;align-items:center;gap:6px}
.sync-status{font-size:11px;color:var(--text3)}
.main{flex:1;overflow-y:auto;padding-bottom:70px}
.page{display:none;padding:16px}
.page.active{display:block}
.bottom-nav{display:flex;border-top:0.5px solid var(--border);background:var(--bg);padding:6px 0 max(2px,env(safe-area-inset-bottom));position:fixed;bottom:0;left:0;right:0}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;cursor:pointer;border:none;background:none;color:var(--text2);font-size:10px;border-radius:var(--radius)}
.nav-item.active{color:var(--text)}
.nav-item i{font-size:20px}

/* 天気予報 */
.weather-forecast{border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:12px;margin-bottom:14px;background:var(--bg2)}
.forecast-title{font-size:11px;color:var(--text2);margin-bottom:8px;font-weight:600;display:flex;align-items:center;gap:5px}
.forecast-days{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.forecast-day{flex-shrink:0;text-align:center;padding:8px 10px;border-radius:var(--radius);background:var(--bg);border:0.5px solid var(--border);min-width:58px}
.forecast-day.today{border-color:var(--uber);background:rgba(6,193,103,0.07)}
.forecast-day .fd-date{font-size:10px;color:var(--text2);margin-bottom:3px}
.forecast-day .fd-icon{font-size:20px;margin-bottom:3px}
.forecast-day .fd-temp{font-size:10px;color:var(--text2)}
.forecast-day .fd-expect{font-size:10px;font-weight:600;margin-top:3px}
.fd-expect.high{color:var(--uber)}.fd-expect.mid{color:#BA7517}.fd-expect.low{color:var(--text2)}

/* 出発・帰宅ボタン */
.session-block{border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:12px;margin-bottom:10px;background:var(--bg2)}
.session-title{font-size:11px;font-weight:600;color:var(--text2);margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.session-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.btn-depart{padding:14px;border-radius:var(--radius-lg);border:none;cursor:pointer;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--uber);color:#fff}
.btn-depart:active{opacity:.8}
.btn-return{padding:14px;border-radius:var(--radius-lg);border:none;cursor:pointer;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--bg3);color:var(--text);border:0.5px solid var(--border2)}
.btn-return:active{opacity:.8}
.btn-return.active-session{background:var(--demae);color:#fff;border:none}
.session-list{display:flex;flex-direction:column;gap:5px}
.session-row{display:flex;align-items:center;justify-content:space-between;background:var(--bg);border-radius:var(--radius);padding:7px 10px;font-size:12px}
.session-row .sr-time{color:var(--text2)}
.session-row .sr-dur{font-weight:600;color:var(--uber)}
.session-row .sr-del{background:none;border:none;color:var(--text3);cursor:pointer;font-size:13px;padding:2px 4px}
.total-hours-row{display:flex;align-items:center;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:0.5px solid var(--border)}
.total-hours-row .th-label{font-size:11px;color:var(--text2)}
.total-hours-row .th-val{font-size:14px;font-weight:700;color:var(--uber)}
.session-row{background:var(--bg);border-radius:var(--radius);margin-bottom:4px;overflow:hidden}
.session-row-header{display:flex;align-items:center;justify-content:space-between;padding:7px 10px}
.session-row-edit{display:none;padding:8px 10px;border-top:0.5px solid var(--border);background:var(--bg2);gap:8px;align-items:center;flex-wrap:wrap}
.session-row-edit.open{display:flex}
.session-row-edit label{font-size:11px;color:var(--text2);margin-right:2px}
.session-row-edit input[type=time]{padding:5px 8px;border-radius:var(--radius);border:0.5px solid var(--border2);background:var(--bg);color:var(--text);font-size:13px}
.sr-edit-btn{background:none;border:none;color:var(--text3);cursor:pointer;font-size:13px;padding:2px 4px}
.sr-edit-btn.active{color:var(--uber)}
.sr-del{background:none;border:none;color:var(--text3);cursor:pointer;font-size:13px;padding:2px 4px}
/* 時給サマリーカード */
.hourly-summary{border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:12px;margin-top:8px;background:var(--bg2)}
.hourly-summary .hs-title{font-size:11px;font-weight:600;color:var(--text2);margin-bottom:8px}
.hourly-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.hourly-cell{background:var(--bg);border-radius:var(--radius);padding:8px;text-align:center}
.hourly-cell .hc-label{font-size:10px;color:var(--text2);margin-bottom:2px}
.hourly-cell .hc-val{font-size:14px;font-weight:700}

/* Entry */
.date-weather-row{display:grid;grid-template-columns:1.4fr 1fr;gap:10px;margin-bottom:14px}
.date-input-wrap{display:flex;align-items:flex-end;gap:4px}
.date-btn{background:var(--bg2);border:0.5px solid var(--border2);color:var(--text);padding:10px 8px;border-radius:var(--radius);cursor:pointer;font-size:12px;height:38px;display:flex;align-items:center;justify-content:center;gap:2px;white-space:nowrap}
.date-btn:active{background:var(--bg3)}
.field{flex:1;display:flex;flex-direction:column}
.field label{display:block;font-size:11px;color:var(--text2);margin-bottom:4px}
.field input,.field select{width:100%;padding:10px 12px;border-radius:var(--radius);border:0.5px solid var(--border2);background:var(--bg);color:var(--text);font-size:14px;-webkit-appearance:none;appearance:none;height:38px}
.plat-block{border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:12px;margin-bottom:10px}
.plat-header{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:13px;font-weight:600}
.plat-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.plat-inputs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.plat-inputs label{font-size:11px;color:var(--text2);display:block;margin-bottom:3px}
.plat-inputs input{width:100%;padding:9px 10px;border-radius:var(--radius);border:0.5px solid var(--border);background:var(--bg2);color:var(--text);font-size:14px}
.note-row{margin-top:8px}
.note-row label{font-size:11px;color:var(--text2);display:block;margin-bottom:3px}
.note-row textarea{width:100%;padding:8px 10px;border-radius:var(--radius);border:0.5px solid var(--border);background:var(--bg2);color:var(--text);font-size:13px;resize:none;height:60px;font-family:inherit}
.save-btn{width:100%;padding:14px;border-radius:var(--radius-lg);background:var(--text);color:var(--bg);border:none;cursor:pointer;font-size:15px;font-weight:600;margin-top:10px;display:flex;align-items:center;justify-content:center;gap:8px}
.save-btn:active{opacity:.8}
.entry-hint{font-size:11px;color:var(--text2);text-align:center;padding:4px 0 10px;display:none}
.entry-hint.show{display:block}
.entry-hint.loaded{color:var(--uber)}

/* 合計報酬バナー */
.daily-total-banner{border-radius:var(--radius-lg);padding:14px 16px;margin-bottom:14px;background:var(--bg2);border:0.5px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.dtb-label{font-size:11px;color:var(--text2);margin-bottom:3px}
.dtb-amount{font-size:32px;font-weight:700;color:var(--uber);letter-spacing:-0.5px;line-height:1}
.dtb-amount.zero{color:var(--text3)}
.dtb-right{text-align:right}
.dtb-sub{font-size:12px;color:var(--text2);margin-top:3px}
/* 先月同日比較 */
.lastmonth-bar{border-radius:var(--radius);padding:10px 12px;margin-bottom:14px;background:var(--bg2);border:0.5px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:8px}
.lmb-label{font-size:11px;color:var(--text2)}
.lmb-vals{display:flex;align-items:center;gap:8px}
.lmb-prev{font-size:13px;color:var(--text2)}
.lmb-diff{font-size:13px;font-weight:700}

/* Summary */
.section-title{font-size:11px;font-weight:600;color:var(--text2);margin:16px 0 8px;text-transform:uppercase;letter-spacing:.5px}
.month-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.month-bar button{background:none;border:0.5px solid var(--border2);border-radius:var(--radius);padding:7px 14px;cursor:pointer;color:var(--text);font-size:13px}
.month-bar span{font-size:15px;font-weight:600}
.stat2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.stat-card{background:var(--bg2);border-radius:var(--radius);padding:12px}
.stat-card .slabel{font-size:11px;color:var(--text2);margin-bottom:4px}
.stat-card .sval{font-size:18px;font-weight:600}
.stat-card .sdiff{font-size:11px;margin-top:3px;display:flex;flex-direction:column;gap:1px}
.stat-card-full{grid-column:span 2;background:var(--bg3);border:0.5px solid var(--border)}
.expense-input-box{display:flex;align-items:center;gap:10px;background:var(--bg);padding:6px 12px;border-radius:var(--radius);margin-top:6px;border:0.5px solid var(--border2)}
.expense-input-box input{border:none;background:transparent;color:var(--text);font-size:15px;font-weight:600;width:100%;outline:none}
.up{color:var(--up)}.down{color:var(--down)}.neu{color:var(--text2)}
.year-banner{background:var(--bg2);border-radius:var(--radius-lg);padding:14px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
.year-banner .yl{font-size:11px;color:var(--text2);margin-bottom:2px}
.year-banner .yv{font-size:22px;font-weight:600}
.goal-section{background:var(--bg2);border-radius:var(--radius-lg);padding:14px;margin-bottom:12px}
.goal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.goal-header span{font-size:13px;font-weight:600}
.goal-header .goal-pct{font-size:20px;font-weight:700;color:var(--uber)}
.goal-bar-bg{height:8px;background:var(--border);border-radius:4px;overflow:hidden;margin-bottom:6px}
.goal-bar-fill{height:100%;border-radius:4px;background:var(--uber);transition:width .4s}
.goal-bar-fill.over{background:#BA7517}
.goal-sub{font-size:11px;color:var(--text2);display:flex;justify-content:space-between}
.goal-input-row{display:flex;align-items:center;gap:8px;margin-top:10px}
.goal-input-row label{font-size:11px;color:var(--text2);white-space:nowrap}
.goal-input-row input{flex:1;padding:7px 10px;border-radius:var(--radius);border:0.5px solid var(--border2);background:var(--bg);color:var(--text);font-size:14px}
.plat-row{border:0.5px solid var(--border);border-radius:var(--radius);padding:10px 12px;display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.bar-wrap{height:5px;background:var(--border);border-radius:3px;overflow:hidden;margin:-2px 0 6px}
.bar-fill{height:100%;border-radius:3px}
.weather-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.weather-card{border:0.5px solid var(--border);border-radius:var(--radius);padding:10px 12px}
.weather-card .wicon{font-size:20px;margin-bottom:3px}
.weather-card .wname{font-size:11px;color:var(--text2);margin-bottom:2px}
.weather-card .wval{font-size:15px;font-weight:600}
.weather-card .wsub{font-size:11px;color:var(--text2);margin-top:2px}
.dow-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:12px}
.dow-card{text-align:center;padding:8px 4px;border:0.5px solid var(--border);border-radius:var(--radius);background:var(--bg2)}
.dow-card .dc-day{font-size:11px;font-weight:600;margin-bottom:3px}
.dow-card .dc-val{font-size:11px;font-weight:700}
.dow-card .dc-cnt{font-size:10px;color:var(--text2);margin-top:1px}
.rank-list{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.rank-item{display:flex;align-items:center;gap:10px;border:0.5px solid var(--border);border-radius:var(--radius);padding:10px 12px}
.rank-num{font-size:15px;font-weight:700;min-width:22px;color:var(--text2)}
.rank-num.gold{color:#BA7517}.rank-num.silver{color:#888780}.rank-num.bronze{color:#993C1D}
.rank-info{flex:1}
.rank-date{font-size:13px;font-weight:600}
.rank-detail{font-size:11px;color:var(--text2);margin-top:2px}
.rank-amt{font-size:15px;font-weight:700;color:var(--uber)}
.chart-legend{display:flex;gap:12px;margin-bottom:8px;font-size:11px;color:var(--text2);flex-wrap:wrap}
.chart-legend span{display:flex;align-items:center;gap:4px}
.chart-legend i{width:9px;height:9px;border-radius:2px;display:inline-block}

/* 年間 */
.csv-btn{width:100%;padding:12px;border-radius:var(--radius-lg);background:var(--bg2);color:var(--text);border:0.5px solid var(--border2);cursor:pointer;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:8px}
.csv-btn:active{opacity:.7}
.month-row{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border:0.5px solid var(--border);border-radius:var(--radius);margin-bottom:6px}
.mr-left .mr-month{font-size:13px;font-weight:600}
.mr-left .mr-days{font-size:11px;color:var(--text2)}
.mr-right{text-align:right}
.mr-right .mr-sales{font-size:14px;font-weight:600}
.mr-right .mr-diff{font-size:11px}

/* カレンダー */
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-nav button{background:none;border:0.5px solid var(--border2);border-radius:var(--radius);padding:7px 14px;cursor:pointer;color:var(--text);font-size:13px}
.cal-nav span{font-size:15px;font-weight:600}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:12px}
.cal-dow{text-align:center;font-size:10px;font-weight:600;color:var(--text2);padding:4px 0}
.cal-cell{border-radius:var(--radius);padding:5px 3px;min-height:52px;cursor:pointer;border:0.5px solid transparent;display:flex;flex-direction:column;align-items:center;gap:1px}
.cal-cell:active{background:var(--bg3)}
.cal-cell.other-month{opacity:.3}
.cal-cell.today{border-color:var(--uber)}
.cal-cell.has-data{background:var(--bg2)}
.cal-cell.selected{border-color:var(--text);background:var(--bg3)}
.cal-date{font-size:12px;font-weight:600}
.cal-date.sun{color:#E91E63}.cal-date.sat{color:#4A90D9}
.cal-sales{font-size:9px;font-weight:700;color:var(--uber);line-height:1.2;text-align:center}
.cal-detail{margin-top:10px;border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:12px;display:none}
.cal-detail.show{display:block}
.cal-detail-title{font-size:13px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.cal-summary-bar{background:var(--bg2);border-radius:var(--radius);margin-bottom:12px}
.cal-month-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:4px}
.cal-month-stat{background:var(--bg2);border-radius:var(--radius);padding:10px;text-align:center}
.cms-label{font-size:10px;color:var(--text2);margin-bottom:3px}
.cms-val{font-size:14px;font-weight:700}

.empty{text-align:center;padding:3rem 1rem;color:var(--text2);font-size:13px}
/* バッジ */
.badge-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.badge-card{border-radius:var(--radius-lg);padding:14px;text-align:center;border:0.5px solid var(--border)}
.badge-card.unlocked{background:linear-gradient(135deg,rgba(6,193,103,0.12),rgba(186,117,23,0.08));border-color:var(--uber)}
.badge-card.locked{background:var(--bg2);opacity:.5}
.badge-icon{font-size:28px;margin-bottom:6px}
.badge-name{font-size:12px;font-weight:700;margin-bottom:3px}
.badge-desc{font-size:10px;color:var(--text2)}
.badge-new{display:inline-block;background:var(--uber);color:#fff;font-size:9px;font-weight:700;padding:1px 5px;border-radius:8px;margin-bottom:4px}
/* 週次 */
.week-stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.week-day-list{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.week-day-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border:0.5px solid var(--border);border-radius:var(--radius);background:var(--bg2)}
.week-day-row.today{border-color:var(--uber)}
.wdr-dow{font-size:12px;font-weight:700;min-width:28px}
.wdr-date{font-size:11px;color:var(--text2);min-width:40px}
.wdr-bar-wrap{flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.wdr-bar{height:100%;border-radius:3px;background:var(--uber)}
.wdr-sales{font-size:13px;font-weight:700;min-width:70px;text-align:right}
.wdr-diff{font-size:10px;min-width:50px;text-align:right}
/* 達成予測 */
.goal-forecast{background:rgba(186,117,23,0.1);border:0.5px solid #BA7517;border-radius:var(--radius);padding:10px 12px;margin-top:8px;font-size:12px;color:#BA7517;font-weight:600}
/* キャラクター評価 */
.chara-block{border-radius:var(--radius-lg);padding:14px;margin-bottom:14px;background:linear-gradient(135deg,rgba(255,182,193,0.15),rgba(255,105,180,0.08));border:0.5px solid rgba(255,105,180,0.3)}
.chara-inner{display:flex;align-items:flex-end;gap:12px}
.chara-svg{flex-shrink:0;width:72px;height:72px}
.chara-bubble{flex:1;background:var(--bg);border-radius:12px 12px 12px 4px;padding:10px 12px;border:0.5px solid var(--border);position:relative;min-height:52px}
.chara-bubble::before{content:'';position:absolute;left:-7px;bottom:12px;border:4px solid transparent;border-right-color:var(--border)}
.chara-bubble::after{content:'';position:absolute;left:-5px;bottom:13px;border:3px solid transparent;border-right-color:var(--bg)}
.chara-text{font-size:13px;line-height:1.6;color:var(--text)}
.chara-name{font-size:10px;color:rgba(255,105,180,0.9);font-weight:700;margin-bottom:4px}
.chara-btn{margin-top:10px;width:100%;padding:9px;border-radius:var(--radius);background:rgba(255,105,180,0.12);border:0.5px solid rgba(255,105,180,0.4);color:rgba(255,105,180,1);font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.chara-btn:active{opacity:.7}
.dot-anim{display:flex;align-items:center;gap:3px;padding:4px 0}
.dot-anim span{width:6px;height:6px;border-radius:50%;background:rgba(255,105,180,0.6);display:inline-block;animation:dotbounce 1.2s infinite}
.dot-anim span:nth-child(2){animation-delay:.2s}
.dot-anim span:nth-child(3){animation-delay:.4s}
@keyframes dotbounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-6px)}}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 20px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;z-index:100}
.toast.show{opacity:1}
</style>
</head>
<body>

<div class="topbar">
  <span class="topbar-title"><i class="ti ti-motorbike"></i> 配達記録</span>
  <span class="sync-status" id="sync-status">接続中...</span>
</div>

<div class="main">

  <!-- ① 入力ページ -->
  <div id="page-entry" class="page active">
    <div class="weather-forecast">
      <div class="forecast-title"><i class="ti ti-map-pin"></i>仙台市 7日間の天気予報と売上期待値</div>
      <div class="forecast-days" id="forecast-days"><div style="font-size:12px;color:var(--text2);padding:8px 0">天気予報を取得中...</div></div>
    </div>
    <div class="date-weather-row">
      <div class="date-input-wrap">
        <button class="date-btn" id="btn-prev-day"><i class="ti ti-chevron-left"></i>前日</button>
        <div class="field"><label>日付</label><input type="date" id="inp-date"></div>
        <button class="date-btn" id="btn-next-day">翌日<i class="ti ti-chevron-right"></i></button>
      </div>
      <div class="field"><label>天候</label>
        <select id="inp-weather">
          <option value="sunny">☀️ 晴れ</option>
          <option value="cloudy">⛅ 曇り</option>
          <option value="rainy">🌧️ 雨</option>
          <option value="heavy-rain">⛈️ 大雨</option>
          <option value="snowy">❄️ 雪</option>
        </select>
      </div>
    </div>
    <div class="entry-hint" id="entry-hint"></div>

    <!-- 合計報酬バナー -->
    <div class="daily-total-banner">
      <div>
        <div class="dtb-label">本日の合計報酬</div>
        <div class="dtb-amount zero" id="dtb-amount">¥0</div>
        <div class="dtb-sub" id="dtb-count" style="margin-top:4px">0件</div>
        <div class="dtb-sub" id="dtb-unit">単価 --</div>
      </div>
      <div class="dtb-right">
        <div class="dtb-label">稼働時間</div>
        <div style="font-size:20px;font-weight:700;color:var(--text);margin-bottom:4px" id="dtb-hours">--</div>
        <div class="dtb-sub" id="dtb-hourly" style="color:var(--uber);font-weight:700;font-size:13px">時給 --</div>
      </div>
    </div>

    <!-- 先月同日比較 -->
    <div class="lastmonth-bar" id="lastmonth-bar" style="display:none">
      <div class="lmb-label">先月同日</div>
      <div class="lmb-vals">
        <span class="lmb-prev" id="lmb-prev">--</span>
        <span class="lmb-diff" id="lmb-diff"></span>
      </div>
    </div>

    <!-- 出発・帰宅ボタン -->
    <div class="session-block">
      <div class="session-title">
        <span><i class="ti ti-clock"></i> 稼働セッション</span>
        <span style="display:flex;align-items:center;gap:8px">
          <span id="countup-timer" style="font-size:13px;font-weight:700;color:var(--uber);display:none"></span>
          <span class="th-val" id="total-hours-disp"></span>
        </span>
      </div>
      <div class="session-btns">
        <button class="btn-depart" id="btn-depart"><i class="ti ti-rocket"></i> 出発</button>
        <button class="btn-return" id="btn-return"><i class="ti ti-home"></i> 帰宅</button>
      </div>
      <div class="session-list" id="session-list"></div>
      <div class="total-hours-row" id="total-hours-row" style="display:none">
        <span class="th-label">本日の稼働合計</span>
        <span class="th-val" id="total-hours-val"></span>
      </div>
    </div>
    <div class="plat-block">
      <div class="plat-header"><div class="plat-dot" style="background:var(--uber)"></div>Uber Eats</div>
      <div class="plat-inputs">
        <div><label>売上 (円)</label><input type="number" id="uber-s" placeholder="0" inputmode="numeric"></div>
        <div><label>配達件数</label><input type="number" id="uber-c" placeholder="0" inputmode="numeric"></div>
      </div>
    </div>
    <div class="plat-block">
      <div class="plat-header"><div class="plat-dot" style="background:var(--demae)"></div>出前館</div>
      <div class="plat-inputs">
        <div><label>売上 (円)</label><input type="number" id="demae-s" placeholder="0" inputmode="numeric"></div>
        <div><label>配達件数</label><input type="number" id="demae-c" placeholder="0" inputmode="numeric"></div>
      </div>
    </div>
    <div class="plat-block">
      <div class="plat-header"><div class="plat-dot" style="background:var(--rocket)"></div>Rocket Now</div>
      <div class="plat-inputs">
        <div><label>売上 (円)</label><input type="number" id="rocket-s" placeholder="0" inputmode="numeric"></div>
        <div><label>配達件数</label><input type="number" id="rocket-c" placeholder="0" inputmode="numeric"></div>
      </div>
      <div class="note-row">
        <label>メモ（イベント・特記事項など）</label>
        <textarea id="inp-note" placeholder="例：雨天・花火大会・渋滞あり"></textarea>
      </div>
    </div>
    <button class="save-btn" id="btn-save"><i class="ti ti-device-floppy"></i> 保存する</button>
  </div>

  <!-- ② 分析ページ -->
  <div id="page-summary" class="page">
    <div class="month-bar">
      <button id="btn-prev-month"><i class="ti ti-chevron-left"></i></button>
      <span id="month-label"></span>
      <button id="btn-next-month"><i class="ti ti-chevron-right"></i></button>
    </div>
    <div id="summary-content"></div>
  </div>

  <!-- ③ カレンダーページ -->
  <div id="page-cal" class="page">
    <div class="cal-nav">
      <button id="btn-cal-prev"><i class="ti ti-chevron-left"></i></button>
      <span id="cal-label"></span>
      <button id="btn-cal-next"><i class="ti ti-chevron-right"></i></button>
    </div>
    <div class="cal-month-stats" id="cal-month-stats"></div>
    <div class="cal-grid" id="cal-grid"></div>
    <div class="cal-detail" id="cal-detail"></div>
  </div>

  <!-- ④ 年間ページ -->
  <div id="page-year" class="page">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
      <span style="font-size:15px;font-weight:600" id="year-label"></span>
      <div style="display:flex;gap:8px">
        <button class="date-btn" id="btn-prev-year"><i class="ti ti-chevron-left"></i></button>
        <button class="date-btn" id="btn-next-year"><i class="ti ti-chevron-right"></i></button>
      </div>
    </div>
    <div id="year-content"></div>
  </div>

  <!-- ⑤ 週次ページ -->
  <div id="page-week" class="page">
    <div class="month-bar">
      <button id="btn-prev-week"><i class="ti ti-chevron-left"></i></button>
      <span id="week-label"></span>
      <button id="btn-next-week"><i class="ti ti-chevron-right"></i></button>
    </div>
    <div id="week-content"></div>
  </div>

  <!-- ⑥ バッジページ -->
  <div id="page-badge" class="page">
    <div style="font-size:15px;font-weight:600;margin-bottom:14px">実績バッジ</div>
    <div id="badge-content"></div>
  </div>

</div>

<div class="bottom-nav">
  <button class="nav-item active" id="nav-entry"><i class="ti ti-plus"></i>入力</button>
  <button class="nav-item" id="nav-summary"><i class="ti ti-chart-bar"></i>分析</button>
  <button class="nav-item" id="nav-week"><i class="ti ti-calendar-week"></i>週次</button>
  <button class="nav-item" id="nav-cal"><i class="ti ti-calendar"></i>暦</button>
  <button class="nav-item" id="nav-badge"><i class="ti ti-trophy"></i>バッジ</button>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCKZfC6PtJFVEIgNYEy5nIxrtaw68rinRo",
  authDomain: "delivery-2cac6.firebaseapp.com",
  projectId: "delivery-2cac6",
  storageBucket: "delivery-2cac6.firebasestorage.app",
  messagingSenderId: "441822108642",
  appId: "1:441822108642:web:1f28eb42e2c99d5bd777bb"
};
const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);

let records  = [];
let expenses = {};
let goals    = {};
let monthOffset = 0;
let calOffset   = 0;
let yearOffset  = 0;
let weekOffset  = 0;
let countupInterval = null;
let chartInstances = {};

// セッション管理（当日のメモリ上）
// sessions = [ {depart:"HH:MM", return:"HH:MM"|null}, ... ]
let sessions = [];
let sessionDate = '';

const wmap  = { sunny:'☀️ 晴れ', cloudy:'⛅ 曇り', rainy:'🌧️ 雨', 'heavy-rain':'⛈️ 大雨', snowy:'❄️ 雪' };
const wmapS = { sunny:'☀️', cloudy:'⛅', rainy:'🌧️', 'heavy-rain':'⛈️', snowy:'❄️' };
const DAYS  = ['日','月','火','水','木','金','土'];
const inputIds = ['uber-s','uber-c','demae-s','demae-c','rocket-s','rocket-c'];

// ── ユーティリティ ─────────────────────────────
function totalOf(r){ return r.uber.sales+r.demae.sales+r.rocket.sales; }
function countOf(r){ return r.uber.count+r.demae.count+r.rocket.count; }

function sessionsToHours(sess){
  let mins=0;
  sess.forEach(s=>{
    if(!s.depart||!s.return) return;
    const[dh,dm]=s.depart.split(':').map(Number);
    const[rh,rm]=s.return.split(':').map(Number);
    const diff=(rh*60+rm)-(dh*60+dm);
    if(diff>0) mins+=diff;
  });
  return mins/60;
}

function hoursOf(r){
  if(r.sessions && r.sessions.length) return sessionsToHours(r.sessions);
  if(!r.start||!r.end) return 0;
  const[sh,sm]=r.start.split(':').map(Number);
  const[eh,em]=r.end.split(':').map(Number);
  const m=(eh*60+em)-(sh*60+sm);
  return m>0?m/60:0;
}

function fmtHours(h){
  if(!h) return '';
  const hh=Math.floor(h), mm=Math.round((h-hh)*60);
  return mm>0?`${hh}h${mm}m`:`${hh}h`;
}

function nowTime(){
  const d=new Date();
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

function todayStr(){
  const d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function getMonthStr(){
  const d=new Date(); d.setMonth(d.getMonth()+monthOffset);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}
function getCalMonthStr(){
  const d=new Date(); d.setMonth(d.getMonth()+calOffset);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}
function getYearStr(){ return String(new Date().getFullYear()+yearOffset); }

// ── グラフ ────────────────────────────────────
function drawChart(id,type,data,options){
  if(chartInstances[id]){ chartInstances[id].destroy(); delete chartInstances[id]; }
  const el=document.getElementById(id); if(!el) return;
  chartInstances[id]=new Chart(el,{type,data,options});
}

// ── 天気予報 ──────────────────────────────────
const WMO={0:'sunny',1:'sunny',2:'cloudy',3:'cloudy',45:'cloudy',48:'cloudy',51:'rainy',53:'rainy',55:'rainy',61:'rainy',63:'rainy',65:'heavy-rain',71:'snowy',73:'snowy',75:'snowy',77:'snowy',80:'rainy',81:'rainy',82:'heavy-rain',85:'snowy',86:'snowy',95:'heavy-rain',96:'heavy-rain',99:'heavy-rain'};

async function fetchForecast(){
  try{
    const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=38.2688&longitude=140.8721&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=Asia%2FTokyo&forecast_days=7');
    const json=await r.json();
    const daily=json.daily;
    // weather_code or weathercode どちらでも対応
    if(!daily.weather_code&&daily.weathercode) daily.weather_code=daily.weathercode;
    renderForecast(daily);
  }catch(e){
    document.getElementById('forecast-days').innerHTML='<div style="font-size:12px;color:var(--text2);padding:4px 0">取得失敗</div>';
  }
}
function calcExpected(wkey){
  const hits=records.filter(r=>(r.weather||'sunny')===wkey&&totalOf(r)>0);
  if(hits.length>=2) return Math.round(hits.reduce((s,r)=>s+totalOf(r),0)/hits.length);
  const all=records.filter(r=>totalOf(r)>0);
  if(!all.length) return null;
  const base=Math.round(all.reduce((s,r)=>s+totalOf(r),0)/all.length);
  const ratio={sunny:0.9,cloudy:1.0,rainy:1.2,'heavy-rain':1.35,snowy:1.1};
  return Math.round(base*(ratio[wkey]||1));
}
function renderForecast(daily){
  const today=todayStr();
  document.getElementById('forecast-days').innerHTML=daily.time.map((date,i)=>{
    const wkey=WMO[daily.weather_code[i]]||'cloudy';
    const exp=calcExpected(wkey);
    const expStr=exp?`¥${exp>=10000?(exp/10000).toFixed(1)+'万':exp.toLocaleString()}`:'--';
    const expCls=!exp?'low':exp>=15000?'high':exp>=10000?'mid':'low';
    const dow=DAYS[new Date(date+'T00:00:00').getDay()];
    return `<div class="forecast-day${date===today?' today':''}">
      <div class="fd-date">${date.slice(5).replace('-','/')}(${dow})</div>
      <div class="fd-icon">${wmapS[wkey]}</div>
      <div class="fd-temp">${Math.round(daily.temperature_2m_min[i])}°/${Math.round(daily.temperature_2m_max[i])}°</div>
      <div class="fd-expect ${expCls}">${expStr}</div>
    </div>`;
  }).join('');
}

// ── セッション管理 ────────────────────────────
function loadSessions(date){
  sessionDate=date;
  const ex=records.find(r=>r.date===date);
  sessions = ex && ex.sessions ? JSON.parse(JSON.stringify(ex.sessions)) : [];
  renderSessions();
}

function renderSessions(){
  const list=document.getElementById('session-list');
  const totalRow=document.getElementById('total-hours-row');
  const returnBtn=document.getElementById('btn-return');

  const inSession=sessions.length>0&&!sessions[sessions.length-1].return;
  returnBtn.className=inSession?'btn-return active-session':'btn-return';

  if(!sessions.length){ list.innerHTML=''; totalRow.style.display='none'; updateTotalHoursDisp(); return; }

  list.innerHTML=sessions.map((s,i)=>{
    const dur=s.return?fmtHours(sessionsToHours([s])):'稼働中...';
    const retStr=s.return||'--:--';
    return `<div class="session-row" id="srow-${i}">
      <div class="session-row-header">
        <span class="sr-time">${s.depart} → ${retStr}</span>
        <span style="display:flex;align-items:center;gap:2px">
          <span class="sr-dur" style="font-size:12px;font-weight:600;color:var(--uber);margin-right:4px">${dur}</span>
          <button class="sr-edit-btn" data-i="${i}" title="時刻を修正"><i class="ti ti-pencil"></i></button>
          <button class="sr-del" data-i="${i}" title="削除"><i class="ti ti-x"></i></button>
        </span>
      </div>
      <div class="session-row-edit" id="sedit-${i}">
        <div style="display:flex;align-items:center;gap:4px">
          <label>出発</label>
          <input type="time" id="sedit-dep-${i}" value="${s.depart||''}">
        </div>
        <div style="display:flex;align-items:center;gap:4px">
          <label>帰宅</label>
          <input type="time" id="sedit-ret-${i}" value="${s.return||''}">
        </div>
        <button style="padding:5px 10px;border-radius:var(--radius);background:var(--uber);color:#fff;border:none;cursor:pointer;font-size:12px;font-weight:600" data-confirm="${i}">確定</button>
      </div>
    </div>`;
  }).join('');

  // 編集ボタン：トグル
  list.querySelectorAll('.sr-edit-btn').forEach(btn=>{
    btn.addEventListener('click',e=>{
      const i=+e.currentTarget.dataset.i;
      const editRow=document.getElementById(`sedit-${i}`);
      const isOpen=editRow.classList.contains('open');
      // 全部閉じる
      list.querySelectorAll('.session-row-edit').forEach(r=>r.classList.remove('open'));
      list.querySelectorAll('.sr-edit-btn').forEach(b=>b.classList.remove('active'));
      if(!isOpen){
        editRow.classList.add('open');
        e.currentTarget.classList.add('active');
      }
    });
  });

  // 確定ボタン
  list.querySelectorAll('[data-confirm]').forEach(btn=>{
    btn.addEventListener('click',e=>{
      const i=+e.currentTarget.dataset.confirm;
      const depVal=document.getElementById(`sedit-dep-${i}`).value;
      const retVal=document.getElementById(`sedit-ret-${i}`).value;
      if(!depVal){ showToast('出発時刻を入力してください'); return; }
      sessions[i].depart=depVal;
      sessions[i].return=retVal||null;
      renderSessions();
      updateDailyTotal();
      scheduleAutoSave();
    });
  });

  // 削除ボタン
  list.querySelectorAll('.sr-del').forEach(btn=>{
    btn.addEventListener('click',e=>{
      const i=+e.currentTarget.dataset.i;
      sessions.splice(i,1);
      renderSessions();
      updateDailyTotal();
      scheduleAutoSave();
    });
  });

  const totalH=sessionsToHours(sessions);
  if(totalH>0){
    totalRow.style.display='flex';
    document.getElementById('total-hours-val').textContent=fmtHours(totalH);
  } else {
    totalRow.style.display='none';
  }
  updateTotalHoursDisp();
  updateDailyTotal();
}

function updateTotalHoursDisp(){
  const h=sessionsToHours(sessions);
  document.getElementById('total-hours-disp').textContent=h>0?fmtHours(h):'';
}

function onDepart(){
  const date=document.getElementById('inp-date').value;
  if(date!==sessionDate) loadSessions(date);
  const inSession=sessions.length>0&&!sessions[sessions.length-1].return;
  if(inSession){ showToast('帰宅を先に記録してください'); return; }
  sessions.push({depart:nowTime(),return:null});
  renderSessions();
  updateDailyTotal();
  scheduleAutoSave();
  startCountup();
}

function onReturn(){
  const date=document.getElementById('inp-date').value;
  if(date!==sessionDate) loadSessions(date);
  const inSession=sessions.length>0&&!sessions[sessions.length-1].return;
  if(!inSession){ showToast('出発を先に記録してください'); return; }
  sessions[sessions.length-1].return=nowTime();
  renderSessions();
  updateDailyTotal();
  scheduleAutoSave();
  stopCountup();
}

// ── 合計バナー更新 ────────────────────────────
function calcCurrentHours(){
  let mins=0;
  sessions.forEach(s=>{
    if(!s.depart) return;
    const[dh,dm]=s.depart.split(':').map(Number);
    const retTime=s.return||nowTime();
    const[rh,rm]=retTime.split(':').map(Number);
    const diff=(rh*60+rm)-(dh*60+dm);
    if(diff>0) mins+=diff;
  });
  return mins/60;
}

function updateDailyTotal(){
  const us=+document.getElementById('uber-s').value||0;
  const uc=+document.getElementById('uber-c').value||0;
  const ds=+document.getElementById('demae-s').value||0;
  const dc=+document.getElementById('demae-c').value||0;
  const rs=+document.getElementById('rocket-s').value||0;
  const rc=+document.getElementById('rocket-c').value||0;
  const total=us+ds+rs, count=uc+dc+rc;
  const unit=count>0?Math.round(total/count):0;
  const hrs=calcCurrentHours();
  const amtEl=document.getElementById('dtb-amount');
  amtEl.textContent=`¥${total.toLocaleString()}`;
  amtEl.className=total>0?'dtb-amount':'dtb-amount zero';
  document.getElementById('dtb-count').textContent=`${count}件`;
  document.getElementById('dtb-unit').textContent=count>0?`単価 ¥${unit.toLocaleString()}`:'単価 --';
  document.getElementById('dtb-hours').textContent=hrs>0?fmtHours(hrs):'--';
  document.getElementById('dtb-hourly').textContent=hrs>0&&total>0?`時給 ¥${Math.round(total/hrs).toLocaleString()}`:'時給 --';
  updateLastMonthBar(total);
}

// ── 先月同日比較 ──────────────────────────────
function updateLastMonthBar(todayTotal){
  const date=document.getElementById('inp-date').value;
  if(!date) return;
  const [y,m,d]=date.split('-').map(Number);
  const pm=m===1?12:m-1, py=m===1?y-1:y;
  const prevDate=`${py}-${String(pm).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  const prevRec=records.find(r=>r.date===prevDate);
  const bar=document.getElementById('lastmonth-bar');
  if(!prevRec){ bar.style.display='none'; return; }
  const prevTotal=totalOf(prevRec);
  bar.style.display='flex';
  document.getElementById('lmb-prev').textContent=`¥${prevTotal.toLocaleString()}`;
  const diff=todayTotal-prevTotal;
  const pct=prevTotal>0?Math.round(diff/prevTotal*100):0;
  const diffEl=document.getElementById('lmb-diff');
  if(diff>0){ diffEl.textContent=`▲¥${diff.toLocaleString()} (+${pct}%)`; diffEl.className='lmb-diff up'; }
  else if(diff<0){ diffEl.textContent=`▼¥${Math.abs(diff).toLocaleString()} (${pct}%)`; diffEl.className='lmb-diff down'; }
  else { diffEl.textContent='同額'; diffEl.className='lmb-diff neu'; }
}

// ── 既存データ読み込み ─────────────────────────
function loadEntryForDate(date){
  const hint=document.getElementById('entry-hint');
  const ex=records.find(r=>r.date===date);
  if(ex){
    document.getElementById('uber-s').value =ex.uber.sales||'';
    document.getElementById('uber-c').value =ex.uber.count||'';

// ── Firebase ──────────────────────────────────
function listenToDatabase(){
  onSnapshot(collection(db,'delivery_records'),snap=>{
    records=[];
    snap.forEach(d=>records.push({date:d.id,...d.data()}));
    records.sort((a,b)=>a.date.localeCompare(b.date));
    const cur=document.getElementById('inp-date').value;
    // 稼働中セッションがある場合は入力欄の上書きをスキップ
    const inSession=sessions.length>0&&!sessions[sessions.length-1].return;
    if(cur && !inSession){ loadEntryForDate(cur); }
    fetchForecast();
    updateViews();
    document.getElementById('sync-status').textContent='同期完了 ✓';
  },()=>document.getElementById('sync-status').textContent='同期エラー');

  onSnapshot(collection(db,'monthly_expenses'),snap=>{
    expenses={};
    snap.forEach(d=>expenses[d.id]=d.data().amount||0);
    const ei=document.getElementById('inp-expense');
    if(document.activeElement!==ei) updateViews();
  });

  onSnapshot(collection(db,'monthly_goals'),snap=>{
    goals={};
    snap.forEach(d=>goals[d.id]=d.data().amount||0);
    updateViews();
  });
}

function updateViews(){
  if(document.getElementById('page-summary').classList.contains('active')) renderSummary();
  if(document.getElementById('page-cal').classList.contains('active')) renderCal();
  if(document.getElementById('page-year').classList.contains('active')) renderYear();
  if(document.getElementById('page-week').classList.contains('active')) renderWeek();
  if(document.getElementById('page-badge').classList.contains('active')) renderBadges();
}

// ── ページ切替 ────────────────────────────────
function showPage(p){
  ['entry','summary','cal','year','week','badge'].forEach(n=>{
    document.getElementById('page-'+n).classList.toggle('active',n===p);
    const nav=document.getElementById('nav-'+n);
    if(nav) nav.classList.toggle('active',n===p);
  });

  if(p==='week')    renderWeek();
  if(p==='badge')   renderBadges();

// ── 前日・翌日 ────────────────────────────────
function changeDay(offset){
  const inp=document.getElementById('inp-date');
  if(!inp.value) return;
  const[y,m,d]=inp.value.split('-').map(Number);
  const nd=new Date(y,m-1,d+offset);
  inp.value=`${nd.getFullYear()}-${String(nd.getMonth()+1).padStart(2,'0')}-${String(nd.getDate()).padStart(2,'0')}`;
  loadEntryForDate(inp.value);
}

async function saveRecord(silent=false){
  const date=document.getElementById('inp-date').value;
  if(!date){ if(!silent) showToast('日付を入力してください'); return; }
  const rec={
    weather:document.getElementById('inp-weather').value,
    uber:  {sales:+document.getElementById('uber-s').value||0,count:+document.getElementById('uber-c').value||0},
    demae: {sales:+document.getElementById('demae-s').value||0,count:+document.getElementById('demae-c').value||0},
    rocket:{sales:+document.getElementById('rocket-s').value||0,count:+document.getElementById('rocket-c').value||0},
    sessions: sessions.filter(s=>s.depart),
    note: document.getElementById('inp-note').value||''
  };
  try{
    document.getElementById('sync-status').textContent='保存中...';
    await setDoc(doc(db,'delivery_records',date),rec);
    document.getElementById('sync-status').textContent='同期完了 ✓';
    const hint=document.getElementById('entry-hint');
    hint.textContent='✓ 保存済みデータを読み込みました（上書き保存できます）';
    hint.className='entry-hint show loaded';
    if(!silent) showToast('保存しました ✓');
    updateDailyTotal();
  }catch(e){ if(!silent) showToast('保存に失敗しました'); }
}

// ── CSV ───────────────────────────────────────
function exportCSV(year){
  const yf=records.filter(r=>r.date.startsWith(year));
  if(!yf.length){showToast('データがありません');return;}
  const header='日付,天候,Uber売上,Uber件数,出前館売上,出前館件数,Rocket売上,Rocket件数,合計売上,合計件数,稼働時間(h),時給,メモ';
  const rows=yf.map(r=>{
    const t=totalOf(r),c=countOf(r),h=hoursOf(r);
    return [r.date,wmap[r.weather]||'',r.uber.sales,r.uber.count,r.demae.sales,r.demae.count,r.rocket.sales,r.rocket.count,t,c,h?h.toFixed(2):'',h>0?Math.round(t/h):'',`"${(r.note||'').replace(/"/g,'""')}"`].join(',');
  });
  const csv='\uFEFF'+header+'\n'+rows.join('\n');
  const a=document.createElement('a');
  a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);
  a.download=`配達記録_${year}.csv`; a.click();
  showToast('CSVをダウンロードしました');
}

// ── diffHtml ──────────────────────────────────
function diffHtml(cur,prev,label){
  if(!prev) return `<div class="sdiff neu">--% ${label}</div>`;
  const p=Math.round((cur-prev)/prev*100);
  if(p>0) return `<div class="sdiff up">▲ ${p}% ${label}</div>`;
  if(p<0) return `<div class="sdiff down">▼ ${Math.abs(p)}% ${label}</div>`;
  return `<div class="sdiff neu">→ 0% ${label}</div>`;
}

let calSelected = null;
function renderCal(){
  const month=getCalMonthStr();
  document.getElementById('cal-label').textContent=month.replace('-','年')+'月';
  const[y,m]=month.split('-').map(Number);
  const today=todayStr();
  const f=records.filter(r=>r.date.startsWith(month));
  const monthS=f.reduce((s,r)=>s+totalOf(r),0);
  const monthC=f.reduce((s,r)=>s+countOf(r),0);
  const activeDays=f.filter(r=>totalOf(r)>0).length;

  document.getElementById('cal-month-stats').innerHTML=`
    <div class="cal-month-stat"><div class="cms-label">月間売上</div><div class="cms-val">¥${monthS>=10000?(monthS/10000).toFixed(1)+'万':monthS.toLocaleString()}</div></div>
    <div class="cal-month-stat"><div class="cms-label">稼働日数</div><div class="cms-val">${activeDays}日</div></div>
    <div class="cal-month-stat"><div class="cms-label">総件数</div><div class="cms-val">${monthC}件</div></div>
  `;

  const firstDow=new Date(y,m-1,1).getDay();
  const daysInMonth=new Date(y,m,0).getDate();
  const maxSales=Math.max(...f.map(r=>totalOf(r)),1);

  let html='';
  // 曜日ヘッダー
  DAYS.forEach((d,i)=>{ html+=`<div class="cal-dow" style="color:${i===0?'#E91E63':i===6?'#4A90D9':'var(--text2)'}">${d}</div>`; });
  // 前月の空白
  for(let i=0;i<firstDow;i++) html+='<div></div>';
  // 日付セル
  for(let d=1;d<=daysInMonth;d++){
    const dateStr=`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const rec=records.find(r=>r.date===dateStr);
    const sales=rec?totalOf(rec):0;
    const dow=new Date(dateStr+'T00:00:00').getDay();
    const isToday=dateStr===today;
    const isSel=dateStr===calSelected;
    const intensity=sales>0?Math.max(0.15,sales/maxSales):0;
    const bg=sales>0?`rgba(6,193,103,${intensity*0.6})`:'';
    html+=`<div class="cal-cell${sales>0?' has-data':''}${isToday?' today':''}${isSel?' selected':''}" data-date="${dateStr}" style="${bg?'background:'+bg:''}">
      <span class="cal-date ${dow===0?'sun':dow===6?'sat':''}">${d}</span>
      ${sales>0?`<span class="cal-sales">${sales>=10000?(sales/10000).toFixed(1)+'万':('¥'+sales.toLocaleString())}</span>`:''}
    </div>`;
  }
  document.getElementById('cal-grid').innerHTML=html;

  document.querySelectorAll('.cal-cell').forEach(cell=>{
    cell.addEventListener('click',()=>{
      const date=cell.dataset.date;
      if(calSelected===date){ calSelected=null; document.getElementById('cal-detail').classList.remove('show'); }
      else { calSelected=date; showCalDetail(date); }
      renderCal();
    });
  });

  if(calSelected) showCalDetail(calSelected);
}

    ${rec.note?`<div style="font-size:12px;color:var(--text2);padding:8px;background:var(--bg2);border-radius:var(--radius)">📝 ${rec.note}</div>`:''}

// ── カウントアップタイマー ────────────────────
function startCountup(){
  stopCountup();
  const el=document.getElementById('countup-timer');
  if(!el) return;
  countupInterval=setInterval(()=>{
    const inSession=sessions.length>0&&!sessions[sessions.length-1].return;
    if(!inSession){ stopCountup(); return; }
    const last=sessions[sessions.length-1];
    const[dh,dm]=last.depart.split(':').map(Number);
    const now=new Date();
    const nowMins=now.getHours()*60+now.getMinutes();
    const diff=nowMins-(dh*60+dm);
    if(diff<0){ stopCountup(); return; }
    const h=Math.floor(diff/60), m=diff%60;
    el.textContent=`🚀 ${h>0?h+'h':''}${String(m).padStart(2,'0')}m 経過`;
    el.style.display='inline';
  }, 10000); // 10秒ごとに更新
  // 即時実行
  const inSession=sessions.length>0&&!sessions[sessions.length-1].return;
  if(inSession){
    const last=sessions[sessions.length-1];
    const[dh,dm]=last.depart.split(':').map(Number);
    const now=new Date(), nowMins=now.getHours()*60+now.getMinutes();
    const diff=Math.max(0,nowMins-(dh*60+dm));
    const h=Math.floor(diff/60), m=diff%60;
    el.textContent=`🚀 ${h>0?h+'h':''}${String(m).padStart(2,'0')}m 経過`;
    el.style.display='inline';
  }
}
function stopCountup(){
  clearInterval(countupInterval);
  countupInterval=null;
  const el=document.getElementById('countup-timer');
  if(el) el.style.display='none';
}

// ── 週次ページ ────────────────────────────────
function getWeekDates(offset){
  const now=new Date();
  const day=now.getDay(); // 0=日
  const monday=new Date(now); monday.setDate(now.getDate()-((day+6)%7)+offset*7);
  return Array.from({length:7},(_,i)=>{
    const d=new Date(monday); d.setDate(monday.getDate()+i);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  });
}

function renderWeek(){
  const dates=getWeekDates(weekOffset);
  const start=dates[0], end=dates[6];
  document.getElementById('week-label').textContent=
    `${start.slice(5).replace('-','/')} 〜 ${end.slice(5).replace('-','/')}`;

  const wf=dates.map(d=>records.find(r=>r.date===d)||{date:d,uber:{sales:0,count:0},demae:{sales:0,count:0},rocket:{sales:0,count:0},weather:'sunny'});
  const weekS=wf.reduce((s,r)=>s+totalOf(r),0);
  const weekC=wf.reduce((s,r)=>s+countOf(r),0);
  const activeDays=wf.filter(r=>totalOf(r)>0).length;
  const avgDay=activeDays?Math.round(weekS/activeDays):0;

  // 先週比較
  const prevDates=getWeekDates(weekOffset-1);
  const pwf=prevDates.map(d=>records.find(r=>r.date===d)||{date:d,uber:{sales:0,count:0},demae:{sales:0,count:0},rocket:{sales:0,count:0}});

    const[y,m,day]=d.split('-').map(Number);

      <span class="wdr-diff">${diffStr}</span>

  }).join('');

  const diffPrevWeek=prevWeekS>0?Math.round((weekS-prevWeekS)/prevWeekS*100):null;

  document.getElementById('week-content').innerHTML=`

      <div class="stat-card"><div class="slabel">今週の売上</div><div class="sval">¥${weekS.toLocaleString()}</div>

          ${diffPrevWeek!==null?(diffPrevWeek>0?`<span class="up">▲${diffPrevWeek}% 先週比</span>`:`<span class="down">▼${Math.abs(diffPrevWeek)}% 先週比</span>`):'<span class="neu">-- 先週比</span>'}
          ${diffPrevMonth!==null?(diffPrevMonth>0?`<span class="up">▲${diffPrevMonth}% 先月同週比</span>`:`<span class="down">▼${Math.abs(diffPrevMonth)}% 先月同週比</span>`):'<span class="neu">-- 先月同週比</span>'}
        </div>
      </div>
      <div class="stat-card"><div class="slabel">稼働日 / 件数</div><div class="sval">${activeDays}日 / ${weekC}件</div><div class="sdiff neu">日平均¥${avgDay.toLocaleString()}</div></div>
    </div>
    <div class="week-day-list">${dayRows}</div>
    <div style="position:relative;width:100%;height:160px"><canvas id="chart-week"></canvas></div>
  `;

  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    drawChart('chart-week','bar',
      {labels:wf.map(r=>DAYS[new Date(r.date+'T00:00:00').getDay()]),
       datasets:[
         {label:'今週',data:wf.map(r=>totalOf(r)),backgroundColor:'rgba(6,193,103,.75)',borderColor:'#06C167',borderWidth:1},
         {label:'先月同週',data:pmwf.map(r=>totalOf(r)),backgroundColor:'rgba(155,155,155,.4)',borderColor:'#999',borderWidth:1}
       ]},
      {responsive:true,maintainAspectRatio:false,
       plugins:{legend:{labels:{font:{size:10},boxWidth:10}},tooltip:{callbacks:{label:c=>`¥${c.raw.toLocaleString()}`}}},
       scales:{x:{ticks:{font:{size:11}}},y:{ticks:{callback:v=>`¥${(v/1000).toFixed(0)}k`,font:{size:10}}}}}
    );
  }));
}

// ── バッジ定義・描画 ──────────────────────────
function renderBadges(){
  const allS=records.reduce((s,r)=>s+totalOf(r),0);
  const allDays=records.filter(r=>totalOf(r)>0).length;
  const allH=records.reduce((s,r)=>s+hoursOf(r),0);
  const avgHourly=allH>0?Math.round(allS/allH):0;
  const maxDay=records.reduce((mx,r)=>Math.max(mx,totalOf(r)),0);
  const monthSales={};
  records.forEach(r=>{const m=r.date.slice(0,7);monthSales[m]=(monthSales[m]||0)+totalOf(r);});
  const maxMonth=Math.max(...Object.values(monthSales),0);
  let streak=0;
  for(let i=0;;i++){const d=new Date();d.setDate(d.getDate()-i);const ds=todayStr().slice(0,8).replace(/\d{2}$/,String(d.getDate()).padStart(2,'0'));const dd=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;if(records.find(r=>r.date===dd&&totalOf(r)>0))streak++;else break;}

  // セッション記録数（帰宅あり）
  const completedSessions=records.reduce((s,r)=>(r.sessions||[]).filter(ss=>ss.depart&&ss.return).length+s,0);

  const badges=[
    {icon:'🚀',name:'初稼働',desc:'初めてデータを記録',unlocked:allDays>=1},
    {icon:'📅',name:'7日連続',desc:'7日間連続稼働',unlocked:streak>=7},
    {icon:'📅',name:'30日連続',desc:'30日間連続稼働',unlocked:streak>=30},
    {icon:'💴',name:'月5万達成',desc:'1ヶ月で5万円以上',unlocked:maxMonth>=50000},
    {icon:'💴',name:'月10万達成',desc:'1ヶ月で10万円以上',unlocked:maxMonth>=100000},
    {icon:'💴',name:'月15万達成',desc:'1ヶ月で15万円以上',unlocked:maxMonth>=150000},
    {icon:'⭐',name:'日2万超え',desc:'1日で2万円以上',unlocked:maxDay>=20000},
    {icon:'⭐',name:'日3万超え',desc:'1日で3万円以上',unlocked:maxDay>=30000},
    {icon:'⏱️',name:'時給2000円',desc:'平均時給2000円以上',unlocked:avgHourly>=2000},
    {icon:'⏱️',name:'時給3000円',desc:'平均時給3000円以上',unlocked:avgHourly>=3000},
    {icon:'🏆',name:'累計100日',desc:'累計稼働100日以上',unlocked:allDays>=100},
    {icon:'💎',name:'累計100万円',desc:'累計売上100万円以上',unlocked:allS>=1000000},
    {icon:'🔧',name:'セッション名人',desc:'出発・帰宅を10回記録',unlocked:completedSessions>=10},
    {icon:'🌟',name:'オールラウンダー',desc:'3社すべてで稼働',unlocked:records.some(r=>r.uber.sales>0)&&records.some(r=>r.demae.sales>0)&&records.some(r=>r.rocket.sales>0)},
  ];

  const unlockedCount=badges.filter(b=>b.unlocked).length;
  document.getElementById('badge-content').innerHTML=`
    <div style="font-size:13px;color:var(--text2);margin-bottom:14px">${unlockedCount} / ${badges.length} 解除済み</div>
    <div class="badge-grid">
      ${badges.map(b=>`<div class="badge-card ${b.unlocked?'unlocked':'locked'}">
        <div class="badge-icon">${b.icon}</div>
        <div class="badge-name">${b.name}</div>
        <div class="badge-desc">${b.desc}</div>
        ${b.unlocked?'<div style="margin-top:5px;font-size:10px;color:var(--uber)">✓ 解除済み</div>':''}
      </div>`).join('')}
    </div>
  `;
}

// ── キャラクターAI評価（データ連動セリフ生成） ──
async function requestCharaComment(stats){
  const btn=document.getElementById('chara-btn');
  const textEl=document.getElementById('chara-text');
  if(!textEl||!btn) return;
  btn.disabled=true;
  textEl.innerHTML='<div class="dot-anim"><span></span><span></span><span></span></div>';

  const prevDiff=stats.prevS>0?Math.round((stats.curS-stats.prevS)/stats.prevS*100):null;

  // データに応じてセリフパターンを選択
  await new Promise(r=>setTimeout(r,900)); // 考え中の演出

  let lines=[];
  const s=stats.curS, pct=stats.goalPct, days=stats.active;

  if(s===0){
    lines=[
      'まだデータがないね！今月もいっしょに頑張ろ！💪',
      '数字が入ってないよ〜！売上を入力してね！📝',
    ];
  } else if(pct>=100){
    lines=[
      `すごい！目標${pct}%達成だよ！¥${s.toLocaleString()}、最高すぎる！🎉`,
      `目標クリア！¥${s.toLocaleString()}稼いだんだね、本当にかっこいいよ！✨`,
      `${pct}%達成！もう上限ないじゃん、どこまでいくの〜！🚀`,
    ];
  } else if(prevDiff!==null&&prevDiff>=20){
    lines=[
      `前月より${prevDiff}%もアップ！¥${s.toLocaleString()}、絶好調だね！🔥`,
      `先月から${prevDiff}%アップって、すごい成長じゃん！この調子！💫`,
    ];
  } else if(prevDiff!==null&&prevDiff<=-15){
    lines=[
      `先月より${Math.abs(prevDiff)}%ダウンだけど大丈夫！${days}日も頑張ったじゃん！💪`,
      `ちょっと落ちてるけど、まだ月途中だよ！ここから巻き返そ！🌟`,
    ];
  } else if(s>=150000){
    lines=[
      `¥${s.toLocaleString()}ってすごすぎ！プロ配達員だね！🏆`,
      `${days}日稼働で¥${s.toLocaleString()}！毎日コツコツえらい！✨`,
    ];
  } else if(s>=100000){
    lines=[
      `10万超えてる！¥${s.toLocaleString()}、すごいじゃん！🎊`,
      `${days}日で¥${s.toLocaleString()}稼いだんだね、かっこいい！💪`,
    ];
  } else if(pct>0&&pct<50){
    lines=[
      `目標まで半分以下だけど、${days}日稼働したね！まだまだいけるよ！💨`,
      `¥${s.toLocaleString()}まで来たよ！目標に向けてファイト！🔥`,
    ];
  } else {
    lines=[
      `${days}日間お疲れ様！¥${s.toLocaleString()}、しっかり稼いでるよ！👍`,
      `今月も${days}日頑張ったね！¥${s.toLocaleString()}、積み上げが大事だよ！✨`,
    ];
  }

  const text=lines[Math.floor(Math.random()*lines.length)];
  textEl.textContent=text;

  const mouth=document.getElementById('chara-mouth');
  if(mouth){
    if(prevDiff!==null&&prevDiff<-15) mouth.setAttribute('d','M31 38 Q36 35 41 38');
    else if(pct>=100||s>=100000) mouth.setAttribute('d','M30 34 Q36 42 42 34');
    else mouth.setAttribute('d','M31 35 Q36 40 41 35');
  }
  btn.disabled=false;
  btn.innerHTML='<i class="ti ti-refresh"></i> もう一度評価してもらう';
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}

// ── 初期化 ───────────────────────────────────
document.addEventListener('DOMContentLoaded',()=>{
  const today=todayStr();
  document.getElementById('inp-date').value=today;
  sessionDate=today;

  document.getElementById('btn-save').addEventListener('click',()=>saveRecord(false));
  document.getElementById('btn-depart').addEventListener('click',onDepart);
  document.getElementById('btn-return').addEventListener('click',onReturn);
  document.getElementById('btn-prev-month').addEventListener('click',()=>{monthOffset--;renderSummary();});
  document.getElementById('btn-next-month').addEventListener('click',()=>{monthOffset++;renderSummary();});
  document.getElementById('btn-cal-prev').addEventListener('click',()=>{calOffset--;renderCal();});
  document.getElementById('btn-cal-next').addEventListener('click',()=>{calOffset++;renderCal();});
  document.getElementById('btn-prev-year').addEventListener('click',()=>{yearOffset--;renderYear();});
  document.getElementById('btn-next-year').addEventListener('click',()=>{yearOffset++;renderYear();});
  document.getElementById('btn-prev-week').addEventListener('click',()=>{weekOffset--;renderWeek();});
  document.getElementById('btn-next-week').addEventListener('click',()=>{weekOffset++;renderWeek();});
  document.getElementById('btn-prev-day').addEventListener('click',()=>changeDay(-1));
  document.getElementById('btn-next-day').addEventListener('click',()=>changeDay(1));
  document.getElementById('nav-entry').addEventListener('click',()=>showPage('entry'));
  document.getElementById('nav-summary').addEventListener('click',()=>showPage('summary'));
  document.getElementById('nav-cal').addEventListener('click',()=>showPage('cal'));
  document.getElementById('nav-week').addEventListener('click',()=>showPage('week'));
  document.getElementById('nav-badge').addEventListener('click',()=>showPage('badge'));
  document.getElementById('inp-date').addEventListener('change',e=>loadEntryForDate(e.target.value));

  // 数値入力：inputでリアルタイム表示更新、changeで自動保存
  inputIds.forEach(id=>{
    document.getElementById(id).addEventListener('input',updateDailyTotal);
    document.getElementById(id).addEventListener('change',scheduleAutoSave);
  });
  // 天候・メモが変わったら自動保存
  document.getElementById('inp-weather').addEventListener('change',scheduleAutoSave);
  document.getElementById('inp-note').addEventListener('change',scheduleAutoSave);

  fetchForecast();
  listenToDatabase();
});
</script>
